<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="仕入れスキャナー">
<title>仕入れスキャナー</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#F2F3EF; --surface:#FFFFFF; --surface-2:#F7F7F3;
    --ink:#191B1F; --muted:#5B6270; --line:#E1E3DC;
    --gold:#A9761F; --gold-bg:#F1E2C0;
    --teal:#1F7B70; --teal-bg:#D9EFEC;
    --danger:#B23A2E; --danger-bg:#F5DFDA;
    --good:#2F7D5A; --good-bg:#E1F0E7;
    --radius:14px;
    --font-display:'Zen Kaku Gothic New','Hiragino Sans','Noto Sans JP',sans-serif;
    --font-body:'Noto Sans JP','Hiragino Sans',sans-serif;
    --font-mono:'JetBrains Mono','SF Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171C; --surface:#1B1F26; --surface-2:#20252D;
      --ink:#ECEDEF; --muted:#8B92A0; --line:#2A2F38;
      --gold:#E3A63E; --gold-bg:#3A2E14;
      --teal:#4FB3A9; --teal-bg:#17302D;
      --danger:#E2685A; --danger-bg:#3A211D;
      --good:#4FAE81; --good-bg:#153024;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171C; --surface:#1B1F26; --surface-2:#20252D;
    --ink:#ECEDEF; --muted:#8B92A0; --line:#2A2F38;
    --gold:#E3A63E; --gold-bg:#3A2E14;
    --teal:#4FB3A9; --teal-bg:#17302D;
    --danger:#E2685A; --danger-bg:#3A211D;
    --good:#4FAE81; --good-bg:#153024;
  }

  *{box-sizing:border-box;}
  html,body{ background:var(--bg); }
  body{
    margin:0; color:var(--ink); font-family:var(--font-body);
    line-height:1.6; -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{ max-width:640px; margin:0 auto; padding:0 16px 48px; }

  header.top{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:calc(16px + env(safe-area-inset-top)) 0 12px; border-bottom:1px solid var(--line);
  }
  .brand{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand-left{ display:flex; align-items:baseline; gap:10px; }
  .mark{ font-family:var(--font-mono); font-size:12px; color:var(--gold); background:var(--gold-bg); padding:2px 7px; border-radius:5px; }
  h1{ font-family:var(--font-display); font-weight:900; font-size:19px; margin:0; }
  .icon-btn{ background:none; border:1px solid var(--line); border-radius:9px; width:34px; height:34px; font-size:15px; cursor:pointer; color:var(--ink); flex-shrink:0; }
  .icon-row{ display:flex; gap:8px; }
  .mock-banner{ background:var(--danger); color:#fff; text-align:center; font-size:12px; font-weight:700; padding:4px; letter-spacing:.03em; }

  .steps-nav{ display:flex; gap:4px; margin:12px 0; overflow-x:auto; padding-bottom:2px; }
  .steps-nav .dot{ font-family:var(--font-mono); font-size:10.5px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); border-radius:999px; padding:3px 9px; white-space:nowrap; }
  .steps-nav .dot.active{ color:var(--gold); border-color:var(--gold); font-weight:700; }
  .steps-nav .dot.done{ color:var(--teal); border-color:var(--teal); }

  .panel{ background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px; margin-bottom:16px; }
  .panel h2{ font-family:var(--font-display); font-size:16px; margin:0 0 10px; }
  .panel h3{ font-family:var(--font-display); font-size:14px; margin:16px 0 8px; }
  .panel p.desc{ font-size:13px; color:var(--muted); margin:0 0 14px; }

  label.field-label{ display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; }
  input[type="text"], input[type="password"], input[type="number"]{
    width:100%; font-family:var(--font-mono); font-size:14px;
    padding:10px 12px; border-radius:9px; border:1px solid var(--line);
    background:var(--surface-2); color:var(--ink);
  }
  input[type="checkbox"]{ width:18px; height:18px; }
  textarea{ width:100%; font-family:var(--font-body); font-size:14px; padding:10px 12px; border-radius:9px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); resize:vertical; min-height:60px; }
  input:focus-visible, .dropzone:focus-visible, .btn:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--teal); outline-offset:2px; }
  .field-hint{ font-size:12px; color:var(--muted); margin-top:6px; }
  .field-hint a{ color:var(--teal); }
  .field-row{ margin-bottom:14px; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }

  .dropzone{ border:1.5px dashed var(--line); border-radius:var(--radius); padding:26px 16px; text-align:center; cursor:pointer; }
  .dropzone:hover{ border-color:var(--gold); background:var(--surface-2); }
  .dropzone .icon{ font-size:26px; display:block; margin-bottom:6px; }
  .dropzone .cta{ font-weight:700; font-size:15px; }
  .dropzone .hint{ font-size:12.5px; color:var(--muted); margin-top:4px; }

  .btn{ font-family:var(--font-body); font-weight:700; font-size:15px; border-radius:11px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink); padding:12px 18px; cursor:pointer; }
  .btn-primary{ background:var(--gold); border-color:var(--gold); color:#191203; }
  .btn-primary:disabled, .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-sm{ font-size:13px; padding:8px 12px; border-radius:9px; }
  .btn-danger{ background:var(--danger-bg); border-color:var(--danger); color:var(--danger); }
  .btn-block{ width:100%; }
  .actions{ display:flex; gap:10px; margin-top:14px; flex-wrap:wrap; }

  .status-line{ font-size:13.5px; color:var(--muted); margin-top:10px; }
  .status-line.err{ color:var(--danger); }
  .status-line.ok{ color:var(--good); }

  .banner{ display:flex; gap:8px; align-items:flex-start; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:14px; }
  .banner.info{ background:var(--teal-bg); color:var(--teal); }
  .banner.warn{ background:var(--danger-bg); color:var(--danger); }
  .banner.mock{ background:var(--danger-bg); color:var(--danger); }

  .badge{ font-family:var(--font-mono); font-size:11px; letter-spacing:.02em; padding:3px 9px; border-radius:999px; white-space:nowrap; font-weight:700; }
  .badge.confirmed{ background:var(--good-bg); color:var(--good); }
  .badge.candidate{ background:var(--gold-bg); color:var(--gold); }
  .badge.unknown{ background:var(--surface-2); color:var(--muted); border:1px solid var(--line); }
  .badge.verdict-buy{ background:var(--good-bg); color:var(--good); }
  .badge.verdict-check{ background:var(--gold-bg); color:var(--gold); }
  .badge.verdict-skip{ background:var(--danger-bg); color:var(--danger); }

  .shelf-wrap{ position:relative; border-radius:var(--radius); overflow:hidden; border:1px solid var(--line); }
  .shelf-wrap img{ display:block; width:100%; height:auto; }
  .shelf-wrap svg{ position:absolute; inset:0; width:100%; height:100%; }
  /* font-size intentionally NOT set here: it's an SVG user-unit value on
     the element itself (see app.js), scaled by the viewBox transform.
     A CSS px value here would win the cascade and override that scaling,
     which is exactly the bug that made these labels unreadably small. */
  .box-num{ font-family:var(--font-mono); font-weight:700; }

  .item-list{ display:flex; flex-direction:column; gap:10px; margin-top:14px; }
  .item-row{ display:flex; align-items:center; gap:10px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; cursor:pointer; text-align:left; width:100%; font-family:inherit; color:inherit; }
  .item-row .num{ font-family:var(--font-mono); font-weight:700; color:var(--gold); width:20px; flex-shrink:0; }
  .item-row .label{ flex:1; }
  .item-row .cat{ font-weight:600; font-size:13.5px; }
  .item-row .feat{ font-size:12px; color:var(--muted); }

  .checklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .checklist li{ display:flex; align-items:center; gap:8px; font-size:14px; padding:8px 10px; background:var(--surface-2); border-radius:8px; }
  .checklist li input{ flex-shrink:0; }

  .thumb-row{ display:flex; gap:8px; flex-wrap:wrap; margin:10px 0; }
  .thumb-row img{ width:64px; height:64px; object-fit:cover; border-radius:8px; border:1px solid var(--line); }

  .evidence-block{ background:var(--surface-2); border-radius:10px; padding:12px; margin-bottom:10px; font-size:13px; }
  .evidence-block .k{ color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; margin-bottom:2px; }
  .evidence-block ul{ margin:4px 0 0; padding-left:18px; }

  .kv-table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  .kv-table td{ padding:7px 0; border-bottom:1px solid var(--line); }
  .kv-table td:first-child{ color:var(--muted); }
  .kv-table td:last-child{ text-align:right; font-family:var(--font-mono); font-variant-numeric:tabular-nums; }
  .kv-table tr.total td{ font-weight:700; border-bottom:none; padding-top:10px; }

  .price-list{ display:flex; flex-direction:column; gap:6px; margin:10px 0; }
  .price-list .row{ display:flex; gap:8px; align-items:center; }
  .price-list input{ flex:1; }

  .verdict-card{ text-align:center; padding:28px 16px; }
  .verdict-card .big{ font-family:var(--font-display); font-weight:900; font-size:26px; margin:10px 0; }
  .verdict-card .profit{ font-family:var(--font-mono); font-size:32px; font-weight:700; color:var(--gold); font-variant-numeric:tabular-nums; }

  table.eval-table{ width:100%; border-collapse:collapse; font-size:12.5px; }
  table.eval-table th, table.eval-table td{ border-bottom:1px solid var(--line); padding:6px 4px; text-align:left; }
  .scroll-x{ overflow-x:auto; }

  .mercari-link{ display:inline-flex; align-items:center; gap:4px; font-size:13.5px; font-weight:600; color:var(--teal); text-decoration:none; }
  .mercari-link:hover{ text-decoration:underline; }

  footer.foot{ margin-top:24px; padding-top:14px; border-top:1px solid var(--line); font-size:11.5px; color:var(--muted); }
  [hidden]{ display:none!important; }
  @media (prefers-reduced-motion: reduce){ *{ transition:none!important; } }
</style>
</head>
<body>

<div id="mockBanner" class="mock-banner" hidden>⚠️ モックモード動作中(実際のAI解析ではありません)</div>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-left">
        <span class="mark">JUDGE</span>
        <h1>仕入れスキャナー</h1>
      </div>
      <div class="icon-row">
        <button class="icon-btn" id="evalBtn" title="精度テスト">📊</button>
        <button class="icon-btn" id="settingsBtn" title="設定">⚙️</button>
      </div>
    </div>
    <div class="steps-nav" id="stepsNav"></div>
  </header>

  <main id="screen"></main>

  <footer class="foot">
    このアプリの判定はAIによる画像解析の目安であり、正規品や実売価格を保証するものではありません。最終判断は現物確認の上、ご自身の責任で行ってください。APIキーはお使いの端末にのみ保存され、Google以外には送信されません。
  </footer>
</div>

<script src="checklists.js?v=4"></script>
<script src="scoring.js?v=4"></script>
<script src="schemas.js?v=4"></script>
<script src="gemini.js?v=4"></script>
<script src="prompts.js?v=4"></script>
<script src="mock.js?v=4"></script>
<script src="storage.js?v=4"></script>
<script src="app.js?v=4"></script>
</body>
</html>
